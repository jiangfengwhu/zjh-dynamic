height:4px;width:32px;border-radius:3px;background:var(--line);margin:0 auto 12px}.crop{height:310px;background:#ded6ed;position:relative;display:flex;justify-content:center;align-items:center}.crop .circle{height:220px;width:220px;border:2px solid white;border-radius:50%;box-shadow:0 0 0 100px #18112066;display:flex;align-items:center;justify-content:center;font-size:70px;color:#665180}.crop .circle:after{content:"";position:absolute;inset:0;border-radius:50%}.caption-box{padding:14px;border:1px solid var(--line);border-radius:12px}.settings-note{padding:8px 16px 16px;font-size:12px;color:var(--muted)}.rail{padding:8px 16px;display:flex;gap:12px;border-bottom:1px solid var(--line)}.rail button{display:flex;flex-direction:column;align-items:center;font-size:10px;gap:3px;min-width:44px;min-height:48px}.rail .avatar{width:32px;height:32px;font-size:12px}.feed-chrome{flex:none;background:var(--surface);position:absolute;top:0;width:100%;z-index:4;transition:transform 180ms var(--ease)}.feed-list{padding-top:168px;padding-bottom:65px}.feed-page .tabs{position:absolute;bottom:0;left:0;right:0;z-index:5}.feed-page.reading .feed-chrome{transform:translateY(-100%)}.feed-page.reading .tabs{transform:translateY(100%)}.notes{padding:10px 0;min-width:0}.notes h2{font-size:24px;margin-bottom:8px}.notes p{font-size:13px;color:#74717f}.notes section{margin-top:22px}.notes h3{font-size:12px;color:#8a8494;margin-bottom:8px}.notes li{font-size:13px;margin-bottom:8px}.notes ul{padding-left:18px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.controls select,.controls button{background:#fff;border:1px solid #ddd8e7;min-height:36px;border-radius:8px;padding:6px 9px;font-size:12px}.swatches{display:flex;gap:8px;margin-top:16px}.swatches div{width:36px;height:36px;border-radius:9px;border:1px solid #ccc}.phone.dark{--bg:#24222c;--surface:#19181f;--ink:#eeecf5;--muted:#aaa5b8;--line:#34303f;--accent:#baa6f3;--tint:#30283f;--green:#92cfb8;--red:#f19bab;color-scheme:dark}.phon :root{--bg:#eaf4fa;--surface:#f7fbfe;--ink:#263e4c;--muted:#597180;--line:#d3e3ec;--accent:#984633;--tint:#fce8e1;--radius:18px}

.phone.dark{--bg:#192c37;--surface:#223743;--ink:#eaf3f6;--muted:#afbfca;--line:#3a505c;--accent:#f6baa9;--tint:#493b3b}

.button:active{transform:translateY(1.5px) scale(.97)}.button.secondary,.button.plain,.button.danger{box-shadow:none}.phone.dark .button{background:#f2a38f;color:#49251f}.phone.dark .button.secondary{background:var(--tint);color:var(--accent)}

<main class="desk"><aside class="sidebar"><h1>紫金花</h1><p class="intro">全新 UI / UX · 可交互设计稿<br>平台 + Jolly · 示例内容，不连接真实服务</p><nav id="nav" aria-label="设计页面"></nav></aside><div class="phone" id="phone"><div class="status"><span>9:41</span><span>▮▮▮　◔　▰</span></div><div class="viewport" id="viewport"></div><div class="home-indicator"></div></div><aside class="notes"><h2 id="note-title"></h2><p id="note-purpose"></p><div class="controls"><button id="theme">切换深色</button><button id="motion" aria-pressed="false">减少动效</button><select id="state" aria-label="查看页面状态"><option value="normal">默认状态</option><option value="loading">加载状态</option><option value="empty">空白状态</option><option value="error">失败状态</option><option value="offline">离线状态</option></select></div><section><h3>页面交互</h3><ul id="note-rules"></ul></section><section><h3>全局设计</h3><p>16px 页面边距 / 12px 组件内距<br>48px 点击范围 / 52px 页面标题栏<br>20px 主按钮圆角 / 软陶高光 / 平面信息<br>16px 正文 / 19px 页标题 / 12px 辅助文字</p><div class="swatches"><div style="background:#f2a38f" title="主色"></div><div style="background:#fff3cf" title="主色淡底"></div><div style="background:#263e4c" title="正文"></div><div style="background:#eaf4fa" title="背景"></div><div style="background:#26735e" title="成功"></div></div></section><section><h3>动效</h3><p>点击反馈 120ms，状态切换 160ms，页面进入 220ms，底部面板 240ms。只动画位移和透明度，优先保留滚动流畅度；支持减少动效。</p></section></aside></main>
<script>
const paths={back:'m15 18-6-6 6-6',arrow:'m9 6 6 6-6 6',feed:'M4 6h16M4 12h16M4 18h10',market:'M4 9h16v11H4zM3 9l2-5h14l2 5M9 20v-6h6v6',user:'M20 21v-2a7 7 0 0 0-14 0v2M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',plus:'M12 5v14M5 12h14',search:'M21 21l-5-5M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16',heart:'M20 5c-4-4-8 0-8 0s-4-4-8 0c-5 5 8 15 8 15S25 10 20 5',comment:'M21 11a9 9 0 0 1-9 9H3l2-5a9 9 0 1 1 16-4',share:'M12 16V3m-5 5 5-5 5 5M5 12v8h14v-8',edit:'m4 17-1 4 4-1L20 7l-3-3zM14 7l3 3',spark:'m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z',box:'M3 7l9-4 9 4v11l-9 4-9-4zM3 7l9 4 9-4M12 11v11',image:'M3 3h18v18H3zM3 17l6-6 4 4 4-4 4 4M8 7h.01',check:'m5 12 4 4L19 6',close:'m6 6 12 12M6 18 18 6',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2',download:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4',mail:'M3 5h18v14H3zM3 5l9 8 9-8',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l3 2',shield:'M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6z'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.spark}"/></svg>`;
const go=(id,text,cls='button')=>`<button class="${cls}" data-go="${id}">${text}</button>`;
const button=(text,action='toast',cls='button',extra='')=>`<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`;
const avatar=(name='晴',cls='')=>`<div class="avatar ${cls}">${name}</div>`;
const ib=(n,label,id)=>`<button class="icon-btn" aria-label="${label}" data-${id==='back'?'action="back"':`go="${id}"`}>${icon(n)}</button>`;
const bar=(title,right='',back=true)=>`<header class="bar">${back?ib('back','返回','back'):''}<h1>${title}</h1>${right}</header>`;
const tabs=active=>`<nav class="tabs" aria-label="主导航">${['feed','market','mine'].map((id,i)=>go(id,icon(['feed','market','user'][i])+'<span>'+['动态','应用市场','我的'][i]+'</span>',active===id?'active':'')).join('')}</nav>`;
const filters=(labels,index=0)=>`<div class="filters" role="tablist">${labels.map((s,i)=>`<button class="filter ${i===index?'active':''}" role="tab" aria-selected="${i===index}" data-action="filter">${s}</button>`).join('')}</div>`;
const row=(title,sub,target,n='arrow',right='')=>`<button class="list-row" data-go="${target}"><div class="grow"><strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</div>${right||icon(n)}</button>`;
const field=(label,placeholder,value='',type='text')=>`<label class="field"><span>${label}</span><input aria-label="${label}" type="${type}" placeholder="${placeholder}" value="${value}"></label>`;
const preview=(teal=false)=>`<div class="preview ${teal?'teal':''}"><div class="paper"><b>${teal?'今日专注':'今天的小美好'}</b><p style="margin-top:8px">${teal?'25:00<br>留一点时间给自己':'一杯咖啡，一段散步。<br>收集生活里的微小心动。'}</p></div><div class="decoration">${teal?'25':'✦'}</div></div>`;
const appRow=(title,sub,action='detail',n='spark',right='')=>`<button class="list-row" data-go="${action}"><span class="app-icon">${icon(n)}</span><span class="grow"><strong>${title}</strong><small>${sub}</small></span>${right||icon('arrow')}</button>`;
const footer=html=>`<footer class="footer">${html}</footer>`;

const pages={

function comment(name,text){return `<article class="post">${avatar(name[0])}<div class="grow"><div class="meta"><strong>${name}</strong><small>· 刚刚</small></div><p class="copy">${text}</p>${button('回复','reply','button plain')}</div></article>`}
let current='feed',history=[],screenState='normal',toastTimer,feedOffset=0;
const viewport=document.querySelector('#viewport'),phone=document.querySelector('#phone');
const groups=[...new Set(Object.values(pages).map(p=>p.group))];document.querySelector('#nav').innerHTML=groups.map(g=>`<div class="group">${g}</div>${Object.entries(pages).filter(([id,p])=>p.group===g).map(([id,p])=>`<button class="page-link" data-go="${id}">${p.title}</button>`).join('')}`).join('');
function navigate(id,back=false){if(!pages[id])return;if(!back&&id!==current)history.push(current);current=id;screenState='normal';document.querySelector('#state').value='normal';render()}
function render(){const p=pages[current];viewport.innerHTML=`<div class="page">${p.render()}</div>`;document.querySelectorAll('.page-link').forEach(b=>b.classList.toggle('selected',b.dataset.go===current));document.querySelector('#note-title').textContent=p.title;document.querySelector('#note-purpose').textContent=p.purpose;document.querySelector('#note-rules').innerHTML=p.rules.map(s=>`<li>${s}</li>`).join('');feedOffset=0;const scroll=viewport.querySelector('.scroll');if(scroll)scroll.addEventListener('scroll',()=>{const feed=viewport.querySelector('.feed-page');if(!feed)return;const y=scroll.scrollTop;if(y<12)feed.classList.remove('reading');else if(Math.abs(y-feedOffset)>3)feed.classList.toggle('reading',y>feedOffset);feedOffset=y},{passive:true});applyState()}
function applyState(){if(screenState==='normal')return;const area=viewport.querySelector('.scroll');if(!area)return;if(screenState==='loading'){area.innerHTML=Array.from({length:4},()=>`<div class="pad line"><div class="row">${avatar('')}<div class="grow"><div class="skeleton"></div><div class="skeleton short"></div></div></div><div class="skeleton large"></div></div>`).join('');viewport.querySelectorAll('.footer button').forEach(b=>b.disabled=true)}else if(screenState==='empty'){area.innerHTML=`<div class="empty">${icon('box')}<h3>${['feed','post','notifications','author'].includes(current)?'这里还很安静':'还没有内容'}</h3><p>${['feed','post','notifications'].includes(current)?'有新的分享和回应时，会出现在这里。':'从一个小想法开始，也可以先逛逛。'}</p>${go(['market','detail'].includes(current)?'market':'jolly','去看看','button secondary')}</div>`}else{area.insertAdjacentHTML('afterbegin',`<div class="pad"><div class="notice ${screenState==='error'?'error':'offline'}">${screenState==='error'?'暂时没有完成，输入和草稿已保留。':'当前离线，显示本机已有内容。'} ${button('重试','retry','')}</div></div>`);if(screenState==='offline')viewport.querySelectorAll('[data-action="publish-post"],[data-action="share-app"],[data-action="send-code"],[data-action="comment"]').forEach(b=>b.disabled=true)}}
function toast(text){viewport.querySelector('.toast')?.remove();clearTimeout(toastTimer);viewport.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${text}</div>`);toastTimer=setTimeout(()=>viewport.querySelector('.toast')?.remove(),2400)}
function sheet(title,html){viewport.insertAdjacentHTML('beforeend',`<div class="sheet-mask"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><div class="row between"><h3>${title}</h3>${button(icon('close'),'close-sheet','icon-btn','aria-label="关闭"')}</div>${html}</section></div>`);viewport.querySelector('.sheet button')?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){navigate(b.dataset.go);return}const a=b.dataset.action;if(!a)return;
if(a==='back'){navigate(history.pop()||'feed',true)}
else if(a==='filter'){b.parentElement.querySelectorAll('button').forEach(v=>{v.classList.toggle('active',v===b);v.setAttribute('aria-selected',v===b)});if(current==='works'&&b.textContent==='我安装的')navigate('installed');else if(current==='installed'&&b.textContent==='我创作的')navigate('works');else if(current==='feed'){const user=b.textContent==='用户';viewport.querySelectorAll('.post').forEach(p=>p.hidden=user&&!!p.querySelector('.jolly'));toast('已切换分组')}else toast('设计稿：已选择 '+b.textContent)}
else if(a==='chip'){b.parentElement.querySelectorAll('button').forEach(v=>v.classList.toggle('active',v===b))}
else if(a==='like'){b.classList.toggle('liked');b.innerHTML=icon('heart')+(b.classList.contains('liked')?'9':'8');b.setAttribute('aria-pressed',b.classList.contains('liked'))}
else if(a==='more'){sheet('动态操作',button('删除自己的动态','delete-post','button danger wide')+button('取消','close-sheet','button plain wide'))}
else if(a==='delete-post'){sheet('删除这条动态？',`<p class="hint">删除后无法恢复。此操作只在设计稿中模拟。</p>${button('确认删除','delete-confirm','button danger wide')}`)}
else if(a==='delete-confirm'){viewport.querySelectorAll('.sheet-mask').forEach(x=>x.remove());toast('设计稿：动态已删除')}
else if(a==='close-sheet'){viewport.querySelectorAll('.sheet-mask').forEach(x=>x.remove())}
else if(a==='share'){sheet('分享',button('复制链接','copy','button secondary wide')+go('compose','发动态介绍','button plain wide'))}
else if(a==='task-more'){sheet('制作操作',button('中断制作','stop','button danger wide')+go('requirements','查看需求','button plain wide'))}
else if(a==='stop'){sheet('中断这次制作？',`<p class="hint">保留需求与已完成内容，之后可继续制作。</p>${button('确认中断','stopped','button danger wide')}`)}
else if(a==='stopped'){navigate('task-failed');toast('设计稿：制作已中断')}
else if(['withdraw','delete-engine','logout'].includes(a)){sheet('确认操作',`<p class="hint">${a==='withdraw'?'市场不再展示；作品仍保留。':a==='logout'?'本机应用数据保留；私有作品需登录后查看。':'使用这个引擎的 AI 功能需要重新配置。'}</p>${button('确认','confirm','button danger wide')}`)}
else if(a==='confirm'){viewport.querySelectorAll('.sheet-mask').forEach(x=>x.remove());toast('设计稿：操作已完成')}
else if(a==='verify'){sheet('验证引擎连接',`<p class="hint">真实应用将发送简短请求，可能消耗模型额度。设计稿不调用模型。</p>${button('模拟验证','verify-confirm','button secondary wide')}`)}
else if(a==='verify-confirm'){viewport.querySelectorAll('.sheet-mask').forEach(x=>x.remove());toast('设计稿：连接验证成功')}
else if(a==='send-code'){const mail=viewport.querySelector('input[type=email]');if(!mail?.validity.valid||!mail.value){mail?.focus();toast('请输入有效邮箱');return}const value=mail.value;navigate('otp');viewport.querySelector('#email-hint').textContent='设计稿：验证码发送至 '+value}
else if(a==='resend'){b.disabled=true;let n=60;b.textContent=n+' 秒后重发';const interval=setInterval(()=>{n--;b.textContent=n+' 秒后重发';if(!b.isConnected||n<=0){clearInterval(interval);b.disabled=false;b.textContent='重新发送'}},1000);toast('设计稿：已模拟发送')}
else if(a==='login'){const code=viewport.querySelector('.code');if(!/^\d{6}$/.test(code?.value||'')){toast('请输入六位验证码');return}navigate('mine');toast('设计稿：已模拟登录；实际返回原触发页')}
else if(a==='add-image'){const holder=viewport.querySelector('#images');if(holder){holder.innerHTML=preview()+button('移除图片','remove-image','button plain');toast('示例缩略图已添加')}else toast('设计稿：截图选择与上传入口')}
else if(a==='remove-image'){viewport.querySelector('#images').innerHTML=''}
else if(a==='install'||a==='update'||a==='upload-avatar'){b.disabled=true;b.textContent=a==='upload-avatar'?'正在压缩并上传…':'正在准备应用…';setTimeout(()=>{navigate(a==='upload-avatar'?'profile':a==='update'?'updates':'application');toast(a==='upload-avatar'?'设计稿：头像已保存':'设计稿：准备完成')},1000)}
else if(a==='share-app'){sheet('公开这个版本？',`<p class="hint">随身心晴手账 v1.0.2 将替换当前公开版本。其他候选版本仍不公开。</p>${button('确认公开','shared','button wide')}`)}
else if(a==='shared'){navigate('owned');toast('设计稿：选定版本已公开')}
else if(a==='publish-post'){const text=viewport.querySelector('textarea').value.trim();if(!text&&!viewport.querySelector('#images').innerHTML){toast('写一点内容，或添加图片');return}navigate('feed');toast('设计稿：动态已发布')}
else if(a==='comment'){const box=viewport.querySelector('textarea');if(!box.value.trim()){box.focus();return}const area=viewport.querySelector('.scroll');const p=document.createElement('p');p.className='copy';p.textContent=box.value;const node=document.createElement('article');node.className='post';node.innerHTML=avatar()+'<div class="grow"><strong>晴空的松鼠</strong></div>';node.querySelector('.grow').append(p);area.append(node);box.value='';area.scrollTop=area.scrollHeight;toast('设计稿：评论已发送')}
else if(a==='reply'){viewport.querySelector('textarea').placeholder='回复南风…';viewport.querySelector('textarea').focus()}
else if(a==='appearance'){phone.classList.toggle('dark',b.dataset.mode==='2');toast('主题已切换')}
else if(a==='toggle'||a==='reduce'){b.querySelector('.toggle')?.classList.toggle('off');if(a==='reduce')phone.classList.toggle('reduce-motion')}
else if(a==='organize'){navigate('requirements')}
else if(a==='save-entry'){navigate('application');toast('设计稿：记录已保存')}
else if(a==='retry'){screenState='normal';document.querySelector('#state').value='normal';render();toast('设计稿：重新加载完成')}
else if(a==='read-all'){toast('设计稿：所有通知已读')}
else if(a==='copy'){toast('设计稿：已模拟复制，不写入真实剪贴板')}
else toast('设计稿：已保存，真实服务未调用');
});
document.querySelector('#theme').onclick=()=>{phone.classList.toggle('dark');document.querySelector('#theme').textContent=phone.classList.contains('dark')?'切换浅色':'切换深色'};
document.querySelector('#motion').onclick=e=>{phone.classList.toggle('reduce-motion');e.target.setAttribute('aria-pressed',phone.classList.contains('reduce-motion'));e.target.textContent=phone.classList.contains('reduce-motion')?'恢复动效':'减少动效'};
document.querySelector('#state').onchange=e=>{screenState=e.target.value;render()};
document.addEventListener('input',e=>{if(e.target.id==='zoom'){viewport.querySelector('.crop .circle').style.fontSize=70*Number(e.target.value)+'px'}if(e.target.dataset.search){const q=e.target.value.toLowerCase();viewport.querySelectorAll('.list-row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')viewport.querySelectorAll('.sheet-mask').forEach(x=>x.remove())});
render();
</script>
</html>
